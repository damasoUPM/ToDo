<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDo</title>
</head>
<body>
<div class="task-widget">
    <h2>Tus últimas tareas</h2>
    <ul>
        <li th:each="task : ${recentTasks}">
            <div>
                <strong>Título:</strong> <span th:text="${task.title}">Título</span><br>
                <strong>Descripción:</strong> <span th:text="${task.description}">Descripción</span><br>
                <strong>Fecha límite:</strong> <span th:text="${#dates.format(task.deadline, 'dd/MM/yyyy HH:mm')}">Fecha</span><br>
                <strong>Prioridad:</strong> <span th:text="${task.priority}">Prioridad</span><br>

                <!-- Botón Editar con el ID de la tarea -->
                <button th:onclick="'location.href=\'/tasks/edit/' + ${task.id} + '\''">Editar</button>
            </div>
            <hr>
        </li>
    </ul>

    <button onclick="location.href='/createTask'">+</button>
</div>


</body>
</html>
